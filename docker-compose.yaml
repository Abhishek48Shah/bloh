services:
  blog:
    build: .
    ports:
      - "4000:4000"
    depends_on:
      - db
      - cache

  db:
    image: postgres:18.6
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgres
  cache:
    image: redis:latest
    ports: 
      - "6397:6397"
    volumes:
      - redis-client:/var/lib/redis

volumes:
  postgres-data:
  redis-client:
