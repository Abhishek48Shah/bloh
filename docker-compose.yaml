services:
  app:
    build: .
    ports:
      - "${PORT}:4000"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:18.6
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:8.0
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
